<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2147">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../assets/lucia_cara.webp">
<title>Lala World 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: el mundo 3D ocupa toda la pantalla; HUD en píldoras claras arriba, joystick abajo a la izquierda, botones de acción abajo a la derecha. */
:root{
  --night:#2a2147; --ink:#2b2140; --muted:#6d6390; --line:#eadff5;
  --glass:rgba(255,255,255,.88); --panel:#fffaf2;
  --sun:#ffd23f; --peach:#ff8a3d; --rose:#ff8fb8; --leaf:#3fa45b; --bark:#a8703f; --sky:#7cc8ff;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;margin:0}
:root{padding:0!important}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px);pointer-events:none;z-index:4}
.hud>*{pointer-events:auto}
.brand{font:800 1.3rem/1 var(--display);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:7px 14px 4px;box-shadow:0 3px 0 rgba(43,33,64,.15)}
.brand .a{color:#e9a800}.brand .b{color:var(--bark)}.brand .t{color:#6c8cff;font-size:.8em}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 rgba(43,33,64,.15)}
.chip canvas{width:26px;height:26px;border-radius:50%;margin:-4px 0 -4px -6px}
.spacer{flex:1}
.btn{font:800 .85rem var(--body);display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:8px 12px;cursor:pointer;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);box-shadow:0 3px 0 rgba(43,33,64,.18)}
.btn svg{width:18px;height:18px;flex:none}
.btn:focus-visible,.pick:focus-visible,.sw:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
.btn.primary{background:var(--sun)}
.btn .cnt{font-variant-numeric:tabular-nums;font-size:.8rem}
@media (max-width:1000px){.hud .lbl{display:none}.btn{padding:9px}}
@media (max-width:640px){.brand{display:none}}
/* Controles táctiles */
#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.55);z-index:5;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(43,33,64,.2)}
#acts{position:absolute;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;z-index:5}
.ab{border:0;border-radius:50%;width:70px;height:70px;font:800 .78rem var(--body);color:var(--ink);background:rgba(255,255,255,.9);box-shadow:0 5px 0 rgba(43,33,64,.25);cursor:pointer;touch-action:none;display:grid;place-items:center;text-align:center;line-height:1.05;padding:4px}
.ab.big{width:88px;height:88px;background:var(--sun);font-size:.82rem}
.ab.big.off{background:rgba(255,255,255,.75);color:var(--muted)}
#prompt{position:absolute;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);background:var(--panel);border-radius:14px;padding:6px 12px;font-weight:800;font-size:.85rem;box-shadow:0 4px 0 rgba(43,33,64,.2);z-index:5;max-width:220px;text-align:center}
#keys{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:rgba(42,33,71,.6);color:#fff;border-radius:999px;padding:5px 14px;font-size:.78rem;font-weight:700;z-index:3;white-space:nowrap;pointer-events:none}
/* Minimapa */
#mini{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 64px);width:150px;height:150px;border-radius:50%;border:4px solid rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(43,33,64,.2);z-index:3;background:#9fd67f;cursor:pointer}
#mini.big{width:min(78vmin,520px);height:min(78vmin,520px);border-radius:24px;right:50%;top:50%;transform:translate(50%,-50%);z-index:8}
@media (max-width:720px){#mini{width:104px;height:104px}}
/* Paneles */
.panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:calc(env(safe-area-inset-left,0px) + 16px);z-index:7;background:var(--panel);border-radius:20px;padding:12px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(43,33,64,.3);width:min(360px,calc(100vw - 32px));max-height:calc(100% - 96px);overflow:auto}
.panel h3{margin:0 4px;font:800 1.15rem var(--display);display:flex;align-items:center;gap:8px}
.panel h3 small{font:700 .8rem var(--body);color:var(--muted)}
.panel h3 .x{margin-left:auto;border:0;background:var(--line);border-radius:10px;font:800 .8rem var(--body);padding:5px 9px;cursor:pointer;color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{border:0;background:#fff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 .8rem var(--body);color:var(--ink);cursor:pointer}
.pick canvas{width:56px;height:56px;border-radius:50%}
.pick.sel{background:var(--sun)}
.lrow{display:grid;gap:4px}
.lrow b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0;position:relative}
.sw.txt{width:auto;height:auto;border-radius:12px;padding:5px 9px;font:800 .75rem var(--body);background:#fff;color:var(--ink)}
.sw.sel{box-shadow:0 0 0 3px var(--ink)}
.sw.lock{opacity:.45;filter:grayscale(.7)}
.task{background:#fff;border-radius:14px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start}
.task i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;margin-top:2px}
.task.ok i{background:var(--leaf);border-color:var(--leaf)}
.task b{display:block;font-size:.9rem}.task span{display:block;font-size:.8rem;color:var(--muted);line-height:1.3}
.task em{display:block;font-style:normal;font-size:.75rem;font-weight:800;color:#c46a12;margin-top:2px}
.stars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff;border-radius:14px;padding:8px}
.st svg{width:100%;height:auto;fill:#e6dff0}.st.ok svg{fill:#f2b600}
.idea{background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:.85rem;line-height:1.35}
.idea b{color:#c46a12}
/* Diálogo y avisos */
#dialog{position:absolute;z-index:8;left:max(16px,4%);right:max(16px,4%);max-width:720px;margin-inline:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--panel);border-radius:20px;padding:12px 16px;box-shadow:0 8px 0 rgba(43,33,64,.22);display:flex;gap:12px;align-items:center}
#dialog canvas{width:56px;height:56px;border-radius:16px;flex:none;background:#fff1d6}
#dialog h4{margin:0;font:800 1.1rem var(--display);color:#c46a12}
#dialog p{margin:2px 0 0;font-size:clamp(.85rem,2.2vw,1rem);line-height:1.35}
#dialog .btn{margin-left:auto;flex:none}
#dialog>div{min-width:0}
#toast{position:absolute;z-index:9;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:var(--panel);border-radius:18px;padding:9px 16px;font-weight:800;font-size:clamp(.82rem,2vw,1rem);max-width:88%;text-align:center;box-shadow:0 6px 0 rgba(43,33,64,.2);animation:pop .3s ease-out}
@keyframes pop{from{transform:translate(-50%,-12px);opacity:.3}to{transform:translate(-50%,0);opacity:1}}
#fade{position:absolute;inset:0;background:#fff3dc;opacity:0;pointer-events:none;z-index:6;transition:opacity .45s}
/* Inicio */
#intro{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:radial-gradient(120% 90% at 50% 10%,rgba(255,243,196,.92) 0%,rgba(255,214,160,.92) 45%,rgba(247,169,107,.94) 100%)}
#intro .box{text-align:center;width:min(760px,100%);display:grid;gap:12px;justify-items:center}
#intro h1{margin:0;font:800 clamp(2.6rem,9vw,5rem)/.9 var(--display)}
#intro h1 .a{color:#ffd23f;-webkit-text-stroke:2px #c98200}#intro h1 .b{color:#ffb36b;-webkit-text-stroke:2px #8a4a1a}#intro h1 .t{color:#6c8cff;-webkit-text-stroke:2px #2e4aa8;font-size:.6em}
#intro p{margin:0;font-weight:800;color:#7a4a26}
#intro .picks{width:100%;grid-template-columns:repeat(4,minmax(0,1fr))}
#intro .pick{padding:12px 6px;box-shadow:0 6px 0 rgba(122,74,38,.25)}
#intro .pick canvas{width:84px;height:84px}
#intro .pick span{font-size:.72rem;color:var(--muted);font-weight:700}
@media (max-width:560px){#intro .picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
#go{font:800 1.5rem var(--display);padding:10px 44px 6px;border-radius:999px;background:var(--sun);box-shadow:0 6px 0 #c98200;border:0;cursor:pointer;color:var(--ink)}
#load{font-weight:800;color:#7a4a26}
@media (prefers-reduced-motion:reduce){#toast{animation:none}#fade{transition:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="gl" tabindex="0"></canvas>
  <div class="hud" id="hud" hidden>
    <span class="brand"><span class="a">Lala</span> <span class="b">World</span> <span class="t">3D</span></span>
    <span class="chip"><canvas id="who" width="52" height="52"></canvas><span id="zone">Plaza</span></span>
    <span class="spacer"></span>
    <button class="btn primary" id="bChar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 14.6c.8-.4 1.6-.6 2.5-.6 2.8 0 4.5 2.2 4.5 5"/></svg><span class="lbl">Personaje</span></button>
    <button class="btn" id="bVestir" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 3 6l2 5 3-1v11h8V10l3 1 2-5-5-3c0 2-2 3-4 3S8 5 8 3z"/></svg><span class="lbl">Vestir</span></button>
    <button class="btn" id="bTareas" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><span class="lbl">Tareas</span><span class="cnt" id="taskN">0/8</span></button>
    <button class="btn" id="bStars" type="button"><svg viewBox="0 0 24 24" fill="#f2b600" stroke="#c98200" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg><span class="cnt" id="starN">0</span></button>
    <button class="btn" id="bFull" type="button" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <canvas id="mini" width="300" height="300" hidden></canvas>
  <div id="joy" hidden><i></i></div>
  <div id="prompt" hidden></div>
  <div id="acts" hidden>
    <button class="ab" id="bJump" type="button">SALTAR</button>
    <button class="ab big off" id="bAct" type="button">ACCIÓN</button>
  </div>
  <div id="keys" hidden>WASD para moverte · arrastra para mirar · Espacio saltar · E acción</div>
  <div id="pChar" class="panel" hidden></div>
  <div id="pVestir" class="panel" hidden></div>
  <div id="pTareas" class="panel" hidden></div>
  <div id="pStars" class="panel" hidden></div>
  <div id="dialog" hidden><canvas id="dFace" width="112" height="112"></canvas><div><h4 id="dName"></h4><p id="dText"></p></div><button class="btn primary" id="dOk" type="button">¡Vale!</button></div>
  <div id="toast" hidden></div>
  <div id="fade"></div>
  <div id="intro">
    <div class="box">
      <h1><span class="a">Lala</span> <span class="b">World</span> <span class="t">3D</span></h1>
      <p>¿Con quién quieres explorar la ciudad?</p>
      <div class="picks" id="introPicks"></div>
      <span id="load">Construyendo la ciudad…</span>
      <button id="go" type="button" hidden>¡A jugar!</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ======================================================================
   LALA WORLD 3D — prototipo de mundo abierto
   Misma base técnica que Los Guardianes de Piedra (Three.js r128, toon con
   contornos, cámara en tercera persona, joystick en celular) con la idea
   de Lala World: juego libre, explorar, interactuar, vestir, tareas y
   estrellas de Bubu. Regiones: la Isla de Bubu se abre con 6 estrellas.
   Multijugador desde el diseño: los cambios del mundo pasan por dispatch().
   ====================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const KEY = 'lalaworld3d_v1';
const L = h => new THREE.Color(h).convertSRGBToLinear();

/* ---------- Render ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const DAY = { zen:'#5fb4ff', hor:'#ffe7c2', fog:'#d9ecff', hemiS:'#eaf4ff', hemiG:'#9fc77a', sun:'#fff2d8', sunI:.8, hemiI:.5 };
const NIGHT = { zen:'#121a46', hor:'#3a3f86', fog:'#2b2f63', hemiS:'#6e7bd0', hemiG:'#2a3550', sun:'#9fb2ff', sunI:.22, hemiI:.3 };
scene.fog = new THREE.Fog(L(DAY.fog), 110, 300);
const camera = new THREE.PerspectiveCamera(55, 1, .1, 900);
const hemi = new THREE.HemisphereLight(L(DAY.hemiS), L(DAY.hemiG), DAY.hemiI); scene.add(hemi);
const sun = new THREE.DirectionalLight(L(DAY.sun), DAY.sunI); sun.castShadow = true;
sun.shadow.mapSize.set(1536, 1536); { const s = sun.shadow.camera; s.left = -38; s.right = 38; s.top = 38; s.bottom = -38; s.near = 1; s.far = 200; }
sun.shadow.bias = -.0006; sun.shadow.normalBias = .04;
scene.add(sun); scene.add(sun.target);
const SUN_OFF = new THREE.Vector3(40, 70, 30);

// cielo con degradado (día / noche)
const skyU = { zen:{ value:L(DAY.zen) }, hor:{ value:L(DAY.hor) }, night:{ value:0 } };
{
  const m = new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
    vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 zen,hor;uniform float night;varying vec3 vD;float h(vec3 p){return fract(sin(dot(p,vec3(12.9,78.2,37.7)))*43758.5);}void main(){float y=max(vD.y,0.0);vec3 c=mix(hor,zen,pow(y,0.55));vec3 q=floor(vD*180.0);float s=step(0.997,h(q))*night*smoothstep(0.05,0.3,y);c+=vec3(s);gl_FragColor=vec4(c,1.0);}' });
  const s = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), m); s.renderOrder = -2; scene.add(s);
}

/* ---------- Materiales ---------- */
const TG = (() => { const d = new Uint8Array([120, 120, 120, 200, 200, 200, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RGBFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const MC = {};
const toon = (h, o) => { const k = h + (o ? JSON.stringify(Object.keys(o)) : ''); if (!o && MC[k]) return MC[k]; const m = new THREE.MeshToonMaterial(Object.assign({ color:L(h), gradientMap:TG }, o || {})); if (!o) MC[k] = m; return m; };
const OLM = {};
function olMat(t){ if (OLM[t]) return OLM[t]; return OLM[t] = new THREE.ShaderMaterial({ side:THREE.BackSide, uniforms:{ c:{ value:L('#3a2433') }, t:{ value:t } }, vertexShader:'uniform float t;void main(){vec3 p=position+normal*t;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}', fragmentShader:'uniform vec3 c;void main(){gl_FragColor=vec4(c,1.0);}' }); }
function ol(m, t = .014){ const o = new THREE.Mesh(m.geometry, olMat(t)); o.castShadow = false; m.add(o); return m; }
function M(g, mat, x = 0, y = 0, z = 0, parent, shadow = true){ const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); if (shadow){ m.castShadow = true; m.receiveShadow = true; } (parent || scene).add(m); return m; }
function cvTex(w, h, fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }

/* ======================================================================
   MUNDO
   ====================================================================== */
const LAKE = { x:118, z:0, r:32 }, ISL = { x:130, z:4, r:9 };
function groundH(x, z){
  let h = 0;
  const r = Math.hypot(x, z);
  if (r > 150) h += (r - 150) * (r - 150) * .012;
  if (r > 90) h += Math.sin(x*.05) * Math.cos(z*.06) * .6 * clamp((r - 90)/40, 0, 1);
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
  if (dl < LAKE.r) h = -2.4 * (1 - (dl/LAKE.r)**2);
  const di = Math.hypot(x - ISL.x, z - ISL.z);
  if (di < ISL.r + 4){ const k = clamp((ISL.r + 4 - di)/4, 0, 1); h = lerp(h, .35, k*k*(3 - 2*k)); }
  return h;
}
const WATER_Y = -.3;

// terreno
{
  const g = new THREE.PlaneGeometry(560, 560, 160, 160); g.rotateX(-Math.PI/2);
  const p = g.attributes.position, col = [];
  const cG = L('#8fd06a'), cG2 = L('#7cc25e'), cS = L('#f2dca0'), cD = L('#c9b07a'), tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), h = groundH(x, z); p.setY(i, h);
    const n = Math.sin(x*.21 + z*.13) * Math.cos(z*.17 - x*.07);
    tmp.copy(cG).lerp(cG2, n*.5 + .5);
    const dl = Math.hypot(x - LAKE.x, z - LAKE.z), di = Math.hypot(x - ISL.x, z - ISL.z);
    if (dl < LAKE.r + 4 && di > ISL.r - 2) tmp.lerp(h < -.4 ? cD : cS, clamp((LAKE.r + 4 - dl)/4, 0, 1));
    if (di < ISL.r + 1) tmp.copy(cS).lerp(cG, clamp((ISL.r - 2.5 - di)/2, 0, 1));
    col.push(tmp.r, tmp.g, tmp.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const t = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors:true })); t.receiveShadow = true; scene.add(t);
}
// agua
const waterMat = new THREE.MeshPhongMaterial({ color:L('#58c3f0'), transparent:true, opacity:.86, shininess:90, specular:L('#ffffff') });
const waterMesh = M(new THREE.CircleGeometry(LAKE.r + 1, 64).rotateX(-Math.PI/2), waterMat, LAKE.x, WATER_Y, LAKE.z, null, false); waterMesh.receiveShadow = true;

/* Colisiones y plataformas */
const circles = [], boxes = [], plats = [];

  }
  // pose del modelo
  const sw = Math.sin(P.walk), mv = P.speed > .1 && P.pose === 'stand';
  m.root.position.set(P.x, P.y, P.z); m.root.rotation.order = 'XYZ'; m.root.rotation.set(0, P.yaw, 0); m.body.position.set(0, 0, 0); m.body.rotation.set(0, 0, 0);
  m.legs.forEach((l, i) => { l.rotation.x = mv ? (i ? -sw : sw)*.7 : 0; });
  m.arms.forEach((a, i) => { a.rotation.x = carry ? -1.25 : mv ? (i ? sw : -sw)*.6 : Math.sin(T*2 + i)*.04; });
  m.body.position.y = mv ? Math.abs(Math.cos(P.walk))*.05 : Math.sin(T*2.2)*.008;
  if (!P.ground && P.pose === 'stand'){ m.legs.forEach((l, i) => l.rotation.x = i ? .5 : -.3); m.arms.forEach(a => a.rotation.x = carry ? -1.25 : -2.4); }
  if (P.pose === 'sit' || P.pose === 'slide' || P.pose === 'swing'){ m.legs.forEach(l => l.rotation.x = -1.45); m.arms.forEach(a => a.rotation.x = P.pose === 'swing' ? -2.6 : -.3); m.body.position.y = .02; }
  if (P.pose === 'slide'){ m.body.rotation.x = -.35; m.arms.forEach(a => a.rotation.x = -1.8); }
  if (P.pose === 'sleep'){ m.root.rotation.order = 'YXZ'; m.root.rotation.set(-Math.PI/2, Math.PI, 0); m.root.position.set(P.x, P.y + .22, P.z); m.legs.forEach(l => l.rotation.x = 0); }
  if (P.pose === 'swing' && P.swing){
    const s = P.swing, th = Math.sin(s.ph)*s.amp;
    m.root.position.set(s.x, 3.7 - Math.cos(th)*(2.9 - .38) - .42, s.z + Math.sin(th)*(2.9 - .38)); m.root.rotation.set(-th, 0, 0); P.yaw = 0;
    if (s.amp > .7) state.flags.high = 1;
  }
  if (m.wings.children.length) m.wings.rotation.y = Math.sin(T*8)*.15;
  if (m.star) m.star.rotation.y = T*2;
  // columpios
  swings.forEach(s => { s.ph += dt*1.9; if (!s.rider) s.amp = lerp(s.amp, .05, dt*.6); s.piv.rotation.x = -Math.sin(s.ph)*s.amp; });
  // pelota
  ball.vy -= 18*dt; ball.x += ball.vx*dt; ball.z += ball.vz*dt; ball.y += ball.vy*dt;
  const bf = groundH(ball.x, ball.z) + ball.r; if (ball.y < bf){ ball.y = bf; ball.vy = Math.abs(ball.vy) > 2 ? -ball.vy*.45 : 0; }
  const fr = Math.pow(.35, dt); ball.vx *= fr; ball.vz *= fr;
  const bo = { x:ball.x, z:ball.z }; collide(bo, ball.r); if (bo.x !== ball.x) ball.vx *= -.5; if (bo.z !== ball.z) ball.vz *= -.5; ball.x = bo.x; ball.z = bo.z;
  if (Math.hypot(ball.x - LAKE.x, ball.z - LAKE.z) < LAKE.r - 1){ ball.x = FIELD.x; ball.z = FIELD.z; ball.vx = ball.vz = 0; toast('La pelota volvió a la cancha.'); }
  ball.mesh.position.set(ball.x, ball.y, ball.z); ball.mesh.rotation.x += ball.vz*dt/ball.r; ball.mesh.rotation.z -= ball.vx*dt/ball.r;
  goals.forEach(g => { if (Math.abs(ball.z - FIELD.z) < 1.9 && ((g.s > 0 && ball.x > g.x - .2) || (g.s < 0 && ball.x < g.x + .2)) && ball.y < 1.8){ toast('¡GOOOL!'); confetti(); completeTask('gol'); ball.x = FIELD.x; ball.z = FIELD.z; ball.vx = ball.vz = 0; } });
  // estrellas
  STARS.forEach(st => {
    if (state.stars[st.id]){ st.mesh.visible = false; st.glow.visible = false; return; }
    st.mesh.rotation.y = T*2; st.mesh.position.y = st.y + Math.sin(T*3 + st.x)*.12;
    if (Math.hypot(P.x - st.x, P.z - st.z) < 1.1 && Math.abs((P.y + .6) - st.y) < 1.3) collectStar(st);
  });
  // amigos que pasean
  for (const k in npcs){
    const n = npcs[k], nm = n.P;
    if (n.talkT > 0){ n.talkT -= dt; n.yaw = Math.atan2(P.x - n.x, P.z - n.z); n.walk = 0; }
    else if (n.wait > 0){ n.wait -= dt; }
    else {
      const dx = n.tx - n.x, dz = n.tz - n.z, d = Math.hypot(dx, dz);
      if (d < .3){ n.wait = 2 + Math.random()*4; const h = HOMES[k]; n.tx = h.x + (Math.random() - .5)*12; n.tz = h.z + (Math.random() - .5)*8; }
      else { const sp = 1.5; const o = { x:n.x + dx/d*sp*dt, z:n.z + dz/d*sp*dt }; collide(o, .35); n.x = o.x; n.z = o.z; n.yaw = Math.atan2(dx, dz); n.walk += dt*sp*2.4; }
    }
    const moving = n.wait <= 0 && n.talkT <= 0, s2 = Math.sin(n.walk);
    nm.root.position.set(n.x, groundH(n.x, n.z), n.z); nm.root.rotation.y = n.yaw;
    nm.legs.forEach((l, i) => l.rotation.x = moving ? (i ? -s2 : s2)*.6 : 0); nm.arms.forEach((a, i) => a.rotation.x = moving ? (i ? s2 : -s2)*.5 : (n.talkT > 0 && i ? -2.5 + Math.sin(T*10)*.3 : 0));
    nm.body.position.y = moving ? Math.abs(Math.cos(n.walk))*.04 : 0;
    if (nm.star) nm.star.rotation.y = T*2;
    if (n.tag) n.tag.visible = camera.position.distanceTo(nm.root.position) > 4.5;
  }
  owl.rotation.y = Math.atan2(P.x - owl.position.x, P.z - owl.position.z)*.6; owl.position.y = .55 + Math.abs(Math.sin(T*2))*.03;
  // carros
  cars.forEach(c => {
    const ahead = roadPos(c.s + 5.5);
    const blockedBy = Math.hypot(ahead.x - P.x, ahead.z - P.z) < 4 || Object.values(npcs).some(n => Math.hypot(ahead.x - n.x, ahead.z - n.z) < 3) || cars.some(o => o !== c && ((o.s - c.s + c.perim) % c.perim) < 9 && ((o.s - c.s + c.perim) % c.perim) > 0);
    c.v = lerp(c.v, blockedBy ? 0 : 7, dt*3); c.s += c.v*dt;
    const p = roadPos(c.s); c.g.position.set(p.x, 0, p.z); c.g.rotation.y = p.yaw;
  });
  boat.mesh.position.set(boat.x, -.05 + Math.sin(T*1.5)*.06, boat.z); boat.mesh.rotation.y = boat.yaw - Math.PI/2;
  // fuente y agua
  fountainDrops.forEach(d => { const u = d.userData; u.t += dt*.7; if (u.t > 1){ u.t = 0; u.a = Math.random()*TAU; } const r = u.t*2.2; d.position.set(Math.cos(u.a)*r, 1.9 + u.t*2.4 - u.t*u.t*3.2, Math.sin(u.a)*r); });
  waterMat.color.copy(L('#58c3f0')).lerp(L('#7fd8ff'), (Math.sin(T*.8) + 1)*.15);
  castles.forEach(c => { if (c.userData.grow < 1){ c.userData.grow = Math.min(1, c.userData.grow + dt*3); const e = c.userData.grow; c.scale.setScalar(e < .8 ? e*1.25 : 1 + Math.sin((e - .8)/.2*Math.PI)*.1); } });
  for (let i = splashes.length - 1; i >= 0; i--){ const s = splashes[i], u = s.userData; u.t += dt; u.v.y -= 9*dt; s.position.addScaledVector(u.v, dt); if (u.t > .9){ scene.remove(s); splashes.splice(i, 1); } }
  beds.forEach((b, i) => { if (state.flags['bed' + i]) b.watered = true; const tgt = b.watered ? 1 : .15; b.fl.scale.y = lerp(b.fl.scale.y, tgt, dt*3); });
  // tele
  if (tvOn){ const h = (T*.15) % 1; furn.tvScreen.material.color.setHSL(h, .6, .55); } else furn.tvScreen.material.color.copy(L('#1a1530'));
  // día / noche
  nightK = lerp(nightK, state.night ? 1 : 0, dt*1.5);
  const C = (a, b) => L(a).lerp(L(b), nightK);
  skyU.zen.value.copy(C(DAY.zen, NIGHT.zen)); skyU.hor.value.copy(C(DAY.hor, NIGHT.hor)); skyU.night.value = nightK;
  scene.fog.color.copy(C(DAY.fog, NIGHT.fog)); hemi.color.copy(C(DAY.hemiS, NIGHT.hemiS)); hemi.groundColor.copy(C(DAY.hemiG, NIGHT.hemiG)); hemi.intensity = lerp(DAY.hemiI, NIGHT.hemiI, nightK);
  sun.color.copy(C(DAY.sun, NIGHT.sun)); sun.intensity = lerp(DAY.sunI, NIGHT.sunI, nightK);
  lampBulbs.forEach(b => b.material.color.copy(L('#d8d2c4').lerp(L('#fff3a0'), nightK)));
  furn.lamp.intensity = .6 + nightK*1.2;
  windowsGlass.forEach(m => m.emissive.copy(L('#1c2c48').lerp(L('#ffc66a'), nightK)));
  // casa de muñecas: al entrar se ocultan el frente y el techo
  const inside = insideHouse(P.x, P.z);
  lucHouse.front.forEach(f => f.visible = !inside); lucHouse.roof.visible = !inside;
  // cámara
  const targetDist = inside ? 6 : camDist, pitch = inside ? Math.max(camPitch, .7) : camPitch;
  const ty = P.y + 1.1;
  camLook.lerp(new THREE.Vector3(P.x, ty, P.z), Math.min(1, dt*8));
  const cx = P.x + Math.sin(camYaw)*Math.cos(pitch)*targetDist, cz = P.z + Math.cos(camYaw)*Math.cos(pitch)*targetDist, cy = ty + Math.sin(pitch)*targetDist;
  camPos.lerp(new THREE.Vector3(cx, Math.max(cy, groundH(cx, cz) + .6), cz), Math.min(1, dt*6));
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(P.x + SUN_OFF.x, SUN_OFF.y, P.z + SUN_OFF.z); sun.target.position.set(P.x, 0, P.z);
  // ACCIÓN contextual
  const it = bestInteraction(), bA = $('bAct'), pr = $('prompt');
  let label = it ? it.label : '';
  if (P.pose === 'swing') label = '¡Más alto!'; else if (P.pose === 'sit') label = 'Levantarse'; else if (P.pose === 'sleep') label = state.night ? 'Despertar' : 'Despertar';
  bA.classList.toggle('off', !label); pr.hidden = !label || P.seq; pr.textContent = label;
  // zona
  $('zone').textContent = zoneName();
}
function zoneName(){
  if (insideHouse(P.x, P.z)) return 'Casa de Lucía';
  if (Math.hypot(P.x - ISL.x, P.z - ISL.z) < ISL.r + 6) return 'Isla de Bubu';
  if (P.x > RX + 4) return 'Lago';
  if (Math.hypot(P.x, P.z) < 18) return 'Plaza';
  if (Math.abs(P.x - PARK.x) < 14 && Math.abs(P.z - PARK.z) < 14) return 'Parque';
  if (Math.abs(P.x - FIELD.x) < FIELD.hw + 3 && Math.abs(P.z - FIELD.z) < FIELD.hd + 3) return 'Cancha';
  if (Math.abs(P.x - MARKET.x) < 8 && Math.abs(P.z - MARKET.z) < 6) return 'Frutería';
  if (Math.abs(P.z - 28) < 12 && P.x < 0) return 'Calle de Lucía';
  if (Math.abs(P.x) > RX + 6 || Math.abs(P.z) > RZ + 6) return 'Bosque';
  return 'Barrio';
}
function collectStar(st){
  state.stars[st.id] = 1; dispatch({ t:'star', id:st.id }); splash(st.x, st.y, st.z, '#ffd84a');
  const n = Object.keys(state.stars).length;
  let msg = `¡Una estrella de Bubu! Llevas ${n} de ${STARS.length}.`;
  if (STAR_REWARDS[n] === 'isla') msg += ' ¡El bote ya puede llevarte a la Isla de Bubu!';
  else if (STAR_REWARDS[n]){ giveReward(STAR_REWARDS[n]); msg += ` Ganaste: ${rewardName(STAR_REWARDS[n])}.`; }
  toast(msg); updateBadges(); save();
  if (n === STARS.length){ confetti(); say('Bubu', '¡Encontraste todas mis estrellas! Eres la mejor exploradora de la ciudad.', 'bubu'); }
}

/* Minimapa */
const mini = $('mini'), mctx = mini.getContext('2d');
function drawMini(){
  const big = mini.classList.contains('big'), W = 300, sc = big ? 300/420 : 300/150, cx = big ? 20 : P.x, cz = big ? 0 : P.z;
  const tx = x => W/2 + (x - cx)*sc, tz = z => W/2 + (z - cz)*sc;
  mctx.fillStyle = '#9fd67f'; mctx.fillRect(0, 0, W, W);
  mctx.fillStyle = '#7fc8f0'; mctx.beginPath(); mctx.arc(tx(LAKE.x), tz(LAKE.z), LAKE.r*sc, 0, TAU); mctx.fill();
  mctx.fillStyle = '#f2dca0'; mctx.beginPath(); mctx.arc(tx(ISL.x), tz(ISL.z), ISL.r*sc, 0, TAU); mctx.fill();
  mctx.strokeStyle = '#9b8c99'; mctx.lineWidth = ROAD_W*sc; mctx.strokeRect(tx(-RX), tz(-RZ), 2*RX*sc, 2*RZ*sc);
  mctx.fillStyle = '#f3dfc0'; mctx.beginPath(); mctx.arc(tx(0), tz(0), 16*sc, 0, TAU); mctx.fill();
  mctx.fillStyle = '#6fbf55'; mctx.fillRect(tx(FIELD.x - FIELD.hw), tz(FIELD.z - FIELD.hd), FIELD.hw*2*sc, FIELD.hd*2*sc);
  [[LH.x, LH.z, '#ff8fb8'], [-46, 28, '#ffd84d'], [22, 28, '#7cb6ff'], [0, -68, '#ffb08a'], [MARKET.x, MARKET.z, '#ff6f6f'], [PARK.x, PARK.z, '#ffa04d']].forEach(([x, z, c]) => { mctx.fillStyle = c; mctx.fillRect(tx(x) - 6*sc, tz(z) - 5*sc, 12*sc, 10*sc); });
  if (big){ mctx.fillStyle = '#2b2140'; mctx.font = '800 11px Nunito, sans-serif'; mctx.textAlign = 'center'; [['Plaza', 0, 4], ['Casa de Lucía', LH.x, LH.z + 9], ['Parque', PARK.x, PARK.z - 9], ['Cancha', FIELD.x, FIELD.z - 10], ['Frutería', MARKET.x, MARKET.z - 5], ['Escuela', 0, -77], ['Lago', LAKE.x, LAKE.z - 20], ['Isla de Bubu', ISL.x, ISL.z + 14]].forEach(([n, x, z]) => mctx.fillText(n, tx(x), tz(z))); }
  for (const k in npcs){ const n = npcs[k]; mctx.fillStyle = '#fff'; mctx.beginPath(); mctx.arc(tx(n.x), tz(n.z), 4, 0, TAU); mctx.fill(); }
  mctx.save(); mctx.translate(tx(P.x), tz(P.z)); mctx.rotate(-P.yaw + Math.PI); mctx.fillStyle = '#e8577a'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 2; mctx.beginPath(); mctx.moveTo(0, -9); mctx.lineTo(7, 7); mctx.lineTo(0, 3); mctx.lineTo(-7, 7); mctx.closePath(); mctx.fill(); mctx.stroke(); mctx.restore();
}

/* Bucle */
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); fx.width = w*devicePixelRatio; fx.height = h*devicePixelRatio; }
addEventListener('resize', resize);
let running = false, miniT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (running) update(dt);
  renderer.render(scene, camera);
  if (running){ miniT -= dt; if (miniT <= 0){ drawMini(); miniT = .1; } }
  fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); fctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = parts.length - 1; i >= 0; i--){ const q = parts[i]; q.t += dt; q.x += q.vx*dt; q.y += q.vy*dt; if (q.t > 3.2){ parts.splice(i, 1); continue; } fctx.save(); fctx.translate(q.x, q.y); fctx.rotate(q.rot + q.t*4); fctx.fillStyle = q.c; fctx.fillRect(-q.r, -q.r*.5, q.r*2, q.r); fctx.restore(); }
  requestAnimationFrame(frame);
}

/* Inicio */
function restoreWorld(){
  props.forEach(p => { const s = state.props[p.id]; if (!s) return; p.mesh.position.set(s[0], s[1], s[2]); if (s[3]){ p.gone = true; p.mesh.visible = false; } });
  (state.castles || []).forEach(([x, z]) => addCastle(x, z, false));
  beds.forEach((b, i) => { if (state.flags['bed' + i]){ b.watered = true; b.fl.scale.y = 1; } });
  updateBadges();
}
{
  const wrap = $('introPicks');
  let chosen = state.char;
  for (const id in CHARS){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pick' + (id === chosen ? ' sel' : '');
    b.appendChild(faceIcon(id, 168)); b.insertAdjacentHTML('beforeend', `${CHARS[id].name}<span>${CHARS[id].world}</span>`);
    b.onclick = () => { chosen = id; wrap.querySelectorAll('.pick').forEach(x => x.classList.toggle('sel', x === b)); };
    wrap.appendChild(b);
  }
  $('load').hidden = true; $('go').hidden = false;
  $('go').onclick = () => {
    $('intro').hidden = true; ['hud', 'mini', 'joy', 'acts'].forEach(i => $(i).hidden = false);
    if (!matchMedia('(pointer:coarse)').matches) $('keys').hidden = false;
    restoreWorld(); switchChar(chosen);
    camYaw = P.yaw + Math.PI; running = true; canvas.focus();
    if (!state.done.saludar && !Object.keys(state.stars).length) setTimeout(() => say('Don Búho', `¡Bienvenida a la ciudad, ${CHARS[chosen].name}! Camina con el joystick y usa ACCIÓN para hablar, tomar cosas y jugar. Ven a la plaza: tengo tareas para ti.`, 'owl'), 600);
  };
}
camLook.set(P.x, 1, P.z); camPos.set(P.x, 8, P.z + 10);
resize(); requestAnimationFrame(frame);
if (location.hash === '#debug') window.__g = { P, state, npcs, ball, STARS, props, doAction, switchChar, camera, cam:(y, p, d) => { camYaw = y; camPitch = p; camDist = d; camLook.set(P.x, P.y + 1.1, P.z); camPos.set(P.x + Math.sin(y)*Math.cos(p)*d, P.y + 1.1 + Math.sin(p)*d, P.z + Math.cos(y)*Math.cos(p)*d); } };
})();
</script>
