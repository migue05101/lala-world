<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2147">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/lucia_cara.webp">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Aventuras de Lala y Bubu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: el mundo (ciudad, calle o cuarto) cubre toda la pantalla; HUD en píldoras claras flotando encima. */
:root{
  --night:#2a2147; --ink:#2b2140; --muted:#6d6390; --line:#eadff5;
  --glass:rgba(255,255,255,.88); --panel:#fffaf2;
  --sun:#ffd23f; --peach:#ff8a3d; --rose:#ff8fb8; --leaf:#3fa45b; --bark:#a8703f;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none !important}
:root{padding:0 !important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px);pointer-events:none;z-index:4}
.hud > *{pointer-events:auto}
.brand{font:800 1.3rem/1 var(--display);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:7px 14px 4px;box-shadow:0 3px 0 rgba(43,33,64,.15)}
.brand .a{color:#e9a800}.brand .y{color:var(--muted);font-size:.85em}.brand .b{color:var(--bark)}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 rgba(43,33,64,.15)}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover;margin:-4px 0 -4px -6px}
.chip small{color:var(--muted);font-weight:700}
.spacer{flex:1}
.btn{font:800 .85rem var(--body);display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:8px 12px;cursor:pointer;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);box-shadow:0 3px 0 rgba(43,33,64,.18)}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{filter:brightness(1.05)}
.btn:focus-visible,.place:focus-visible,.room:focus-visible,.pm:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
.btn.primary{background:var(--sun)}
.btn.on{background:var(--leaf);color:#fff}
@media (max-width:1180px){.hud .lbl{display:none}.btn{padding:9px}}
@media (max-width:720px){.brand,.chip small{display:none}.hud{gap:6px}}
.btn .badge{background:var(--peach);color:#fff;border-radius:99px;font-size:.7rem;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 4px}
.btn .cnt{font-variant-numeric:tabular-nums;font-size:.8rem}
/* Intro */
#intro{position:absolute;inset:0;z-index:8;display:grid;place-items:center;text-align:center;padding:16px;background:linear-gradient(180deg,rgba(42,33,71,0) 30%,rgba(42,33,71,.55) 100%)}
#intro .box{display:flex;flex-direction:column;align-items:center;gap:10px}
#intro h1{margin:0;font:800 clamp(3rem,11vw,6.5rem)/.9 var(--display);text-shadow:0 6px 0 rgba(43,33,64,.25)}
#intro h1 .a{color:#ffd23f;-webkit-text-stroke:2px #c98200}
#intro h1 .y{color:#fff;font-size:.55em}
#intro h1 .b{color:#ffb36b;-webkit-text-stroke:2px #8a4a1a}
#intro p{margin:0;font:800 clamp(1rem,2.6vw,1.3rem) var(--body);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}
#intro .who{display:flex;align-items:center;gap:10px;background:var(--glass);border-radius:999px;padding:6px 16px 6px 6px;font-weight:800}
#intro .who img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff1d6}
#intro .play{font:800 1.6rem var(--display);padding:12px 44px 8px;border-radius:999px;background:var(--sun);box-shadow:0 6px 0 #c98200;border:0;cursor:pointer;color:var(--ink)}
#intro .play:active{transform:translateY(3px);box-shadow:0 3px 0 #c98200}
#loading{font-weight:800;color:#fff}
/* Mapa */
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.place{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:0;cursor:pointer;font:800 .82rem var(--body);background:var(--glass);color:var(--ink);border-radius:999px;padding:5px 11px 5px 9px;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 3px 0 rgba(43,33,64,.25)}
.place::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:var(--glass)}
.place i{width:8px;height:8px;border-radius:50%;background:#c9bfdc;flex:none}
.place.go{background:var(--sun);font-size:.95rem;padding:7px 14px 7px 8px;animation:bob 1.6s ease-in-out infinite}
.place.go::after{border-top-color:var(--sun)}
.place.go img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#fff}
.place.big{font:800 1.05rem var(--display);padding:8px 16px 5px;background:#fff}
.place.big::after{border-top-color:#fff}
.place .soon{font-size:.68rem;color:var(--muted);font-weight:700}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-5px}}
#mapTools{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px;z-index:4}
#mapTools .btn{width:46px;height:46px;justify-content:center;font-size:1.4rem;padding:0}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--glass);border-radius:999px;padding:7px 16px;font-weight:800;font-size:.85rem;z-index:3;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(43,33,64,.15)}
/* Paneles de la casa */
.panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);right:calc(env(safe-area-inset-right,0px) + 16px);z-index:5;background:var(--panel);border-radius:20px;padding:10px;display:grid;gap:6px;box-shadow:0 10px 30px rgba(43,33,64,.3);min-width:210px;max-width:min(330px,calc(100vw - 32px));max-height:calc(100% - 96px);overflow:auto}
.panel h3{margin:2px 6px 4px;font:800 1.1rem var(--display)}
.room{border:0;background:#fff;border-radius:14px;padding:9px 12px;font:800 .9rem var(--body);text-align:left;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px}
.room.cur{background:var(--sun)}
.room i{width:10px;height:10px;border-radius:3px;flex:none}
.idea{background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:.88rem;line-height:1.3;display:flex;gap:8px;align-items:flex-start}
.idea b{color:#c46a12;font-weight:800;flex:none}
.panel.wide{max-width:min(380px,calc(100vw - 32px))}
.panel h3 small{font:700 .8rem var(--body);color:var(--muted);margin-left:4px}
.pv{display:block;margin:0 auto;width:150px;height:auto;background:radial-gradient(#fff8e6,#ffe1c4);border-radius:18px}
.lrow{display:grid;gap:4px}
.lrow b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0;position:relative}
.sw.txt{width:auto;height:auto;border-radius:12px;padding:5px 9px;font:800 .75rem var(--body);background:#fff;color:var(--ink)}
.sw.sel{box-shadow:0 0 0 3px var(--ink)}
.sw.lock{opacity:.45;filter:grayscale(.7)}
.sw.lock::after{content:"🔒";position:absolute;right:-6px;bottom:-6px;font-size:.7rem;filter:none}
.bag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{border:0;background:#fff;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 .72rem var(--body);color:var(--ink);cursor:pointer;text-align:center}
.task{background:#fff;border-radius:14px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start}
.task i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;margin-top:2px}
.task.ok i{background:var(--leaf);border-color:var(--leaf)}
.task b{display:block;font-size:.9rem}.task span{display:block;font-size:.8rem;color:var(--muted);line-height:1.3}
.task em{display:block;font-style:normal;font-size:.75rem;font-weight:800;color:#c46a12;margin-top:2px}
.task.ok b{text-decoration:line-through;text-decoration-color:var(--leaf)}
.stars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff;border-radius:14px;padding:8px}
.st svg{width:100%;height:auto;fill:#e6dff0}.st.ok svg{fill:#f2b600}
/* Diálogo y avisos */
#dialog{position:absolute;z-index:6;left:max(16px,4%);right:max(16px,4%);max-width:760px;margin-inline:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--panel);border-radius:20px;padding:10px 14px;box-shadow:0 8px 0 rgba(43,33,64,.22);display:flex;gap:12px;align-items:center}
#dialog img{width:58px;height:58px;border-radius:16px;object-fit:cover;flex:none;background:#fff1d6}
#dialog h3{margin:0;font:800 1.1rem var(--display);color:#c46a12}
#dialog p{margin:2px 0 0;font-size:clamp(.85rem,2.2vw,1rem);line-height:1.35}
#dialog .btn{margin-left:auto;flex:none}
#dialog > div{min-width:0}
#toast{position:absolute;z-index:7;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:var(--panel);border-radius:18px;padding:9px 16px;font-weight:800;font-size:clamp(.82rem,2vw,1rem);max-width:88%;text-align:center;box-shadow:0 6px 0 rgba(43,33,64,.2);animation:pop .3s ease-out}
@keyframes pop{from{transform:translate(-50%,-12px);opacity:.3}to{transform:translate(-50%,0);opacity:1}}
#mission{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 66px);left:calc(env(safe-area-inset-left,0px) + 16px);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:7px 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(43,33,64,.15);pointer-events:none}
#mission .bar{width:70px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
#mission .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--peach));border-radius:99px;transition:width .4s}
#mission .n{font-variant-numeric:tabular-nums;color:var(--muted)}
/* Barra de acción (llevar / sentada) */
#action{position:absolute;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:20px;padding:6px 6px 6px 8px;box-shadow:0 6px 0 rgba(43,33,64,.2);max-width:calc(100% - 32px)}
#action canvas{width:44px;height:44px;border-radius:12px;background:#fff1d6;flex:none}
#action .t{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#action .t small{display:block;font-weight:700;color:var(--muted);font-size:.74rem}
#action .btn{box-shadow:0 3px 0 rgba(43,33,64,.15);flex:none}
/* Menú de un objeto (levantar / jugar) */
#pmenu{position:absolute;z-index:5;display:flex;gap:8px;transform:translate(-50%,-100%)}
.pm{border:0;cursor:pointer;background:var(--panel);border-radius:18px;padding:8px 12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 .78rem var(--body);color:var(--ink);box-shadow:0 5px 0 rgba(43,33,64,.22)}
.pm svg{width:26px;height:26px}
.pm.play{background:var(--sun)}
/* Tablero para dibujar */
#draw{position:absolute;inset:0;z-index:9;background:rgba(42,33,71,.6);display:grid;place-items:center;padding:12px}
#draw .wrap{display:flex;gap:12px;align-items:stretch;background:#c98f55;border-radius:22px;padding:12px;box-shadow:0 10px 0 rgba(43,33,64,.3);max-height:100%}
#draw canvas{display:block;border-radius:8px;touch-action:none;cursor:crosshair;background:#3c5a45;height:min(76vh,560px);width:auto;max-width:60vw}
#draw .tools{display:flex;flex-direction:column;gap:8px;justify-content:center}
.chalk{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.chalk.sel{outline:3px solid var(--ink);outline-offset:2px}
#draw .btn{justify-content:center}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6}
#netlog{position:absolute;z-index:3;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:58%;background:rgba(42,33,71,.88);color:#efeaff;border-radius:12px;padding:8px 10px;font:600 11px/1.45 ui-monospace,Menlo,Consolas,monospace;pointer-events:none}
#netlog b{display:block;font-family:var(--body);font-size:11px;color:#8fe3b4;margin-bottom:2px}
#netlog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.place.go{animation:none}#toast{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <canvas id="fx"></canvas>
  <div id="labels"></div>
  <div class="hud" id="hud" hidden>
    <span class="brand"><span class="a">Lala</span> <span class="y">y</span> <span class="b">Bubu</span></span>
    <span class="chip"><img src="assets/lucia_cara.webp" alt=""><span id="placeName">Ciudad</span></span>
    <span class="spacer"></span>
    <button class="btn primary" id="bIdeas" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="lbl">¿Qué hago?</span></button>
    <button class="btn" id="bVestir" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 3 6l2 5 3-1v11h8V10l3 1 2-5-5-3c0 2-2 3-4 3S8 5 8 3z"/></svg><span class="lbl">Vestir</span></button>
    <button class="btn" id="bBolso" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span class="lbl">Bolso</span><span class="badge" id="bagN" hidden>0</span></button>
    <button class="btn" id="bTareas" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><span class="lbl">Tareas</span><span class="cnt" id="taskN">0/7</span></button>
    <button class="btn" id="bTesoros" type="button" hidden><svg viewBox="0 0 24 24" fill="#f2b600" stroke="#c98200" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg><span class="cnt" id="starN">0</span></button>
    <button class="btn" id="bMap" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span class="lbl">Mapa</span></button>
    <button class="btn" id="bRooms" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span class="lbl">Casa</span></button>
    <button class="btn" id="bNet" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5v4M12 11.5l-5 4.5M12 11.5l5 4.5"/></svg><span class="lbl">Red</span></button>
    <button class="btn" id="bFull" type="button" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="mission" hidden></div>
  <div id="mapTools" hidden>
    <button class="btn" id="zIn" type="button" aria-label="Acercar">+</button>
    <button class="btn" id="zOut" type="button" aria-label="Alejar">−</button>
  </div>
  <div id="hint" hidden></div>
  <div id="rooms" class="panel" hidden></div>
  <div id="ideas" class="panel" hidden></div>
  <div id="pVestir" class="panel wide" hidden></div>
  <div id="pBolso" class="panel" hidden></div>
  <div id="pTareas" class="panel wide" hidden></div>
  <div id="pTesoros" class="panel" hidden></div>
  <div id="pmenu" hidden></div>
  <div id="action" hidden></div>
  <div id="dialog" hidden><img id="dFace" alt=""><div><h3 id="dName"></h3><p id="dText"></p></div><button class="btn primary" id="dOk" type="button">¡Vale!</button></div>
  <div id="toast" hidden></div>
  <div id="netlog" hidden><b>Acciones de red (simuladas)</b><div id="netlines"></div></div>
  <div id="draw" hidden>
    <div class="wrap">
      <canvas id="board"></canvas>
      <div class="tools">
        <div id="chalks" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div>
        <button class="btn" id="dClear" type="button">Borrar</button>
        <button class="btn primary" id="dDone" type="button">Listo</button>
      </div>
    </div>
  </div>
  <div id="intro">
    <div class="box">
      <h1><span class="a">Lala</span> <span class="y">y</span> <span class="b">Bubu</span></h1>
      <p>Una ciudad entera para explorar</p>
      <div class="who"><img src="assets/lucia_cara.webp" alt="">Juegas con Lucía</div>
      <span id="loading">Cargando la ciudad…</span>
      <button class="play" id="bPlay" type="button" hidden>Jugar</button>
    </div>
  </div>
</div>

<script>
(() => {
/* ============================================================
   AVENTURAS DE LALA Y BUBU — prototipo
   Flujo: Intro → Mapa de la ciudad (zoom) → Frente de la casa → Recorrido por la casa.
   Interacciones: levantar y acomodar objetos, guardar en cajas, sentarse,
   columpio, tobogán, pelota, castillos de arena, luces, tele, tablero y dormir.
   Multijugador desde el diseño: todo cambio del mundo es una ACCIÓN (JSON) que pasa
   por dispatch → Net.send → applyAction. Hoy es local; mañana Net.send va a un servidor.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'lalabubu_casa_v2';
const ME = 'yo';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a)*t;

function freshWorld(){
  const props = {};
  for (const id in PROP_DEF){
    const [room, n] = id.split('.'), b = BOX[room][n], d = PROP_DEF[id];
    props[id] = { room, x:b.x + b.w/2, y:b.y + b.h, fy:d.fy, surf:d.surf, cont:null };
  }
  return { props, chairs:[0, 0], lamps:{}, tv:false, ink:null, towers:[], ball:{ x:1171, y:627 }, done:{}, flags:{}, found:{}, unlocked:[...DEFAULT_UNLOCK], look:{ overol:'rosado', monio:'amarillo', camiseta:'amarillo', acc:'ninguno' } };
}
let WORLD = freshWorld();
const S = { players:{} };
let mode = 'intro', T = 0, pending = null, tapRing = null, fade = 0, fadeTo = null, netOn = false;
const netLines = [];
const me = () => S.players[ME];

function applyAction(a){
  if (a.type === 'join'){ S.players[a.pid] = { id:a.pid, name:a.name, scene:a.scene, x:a.x, y:a.y, tx:a.x, ty:a.y, dir:'frente', moving:false, walk:0, idle:0, pose:'stand', carry:null }; return; }
  const p = S.players[a.pid];
  switch (a.type){
    case 'move': if (p){ p.tx = a.x; p.ty = a.y; } break;
    case 'enter': if (p){ p.scene = a.scene; p.x = p.tx = a.x; p.y = p.ty = a.y; p.dir = 'frente'; p.pose = 'stand'; p.fy = null; p.seq = null; if (a.pid === ME){ night = 0; swing.riding = false; } } break;
    case 'pick': { const o = WORLD.props[a.prop]; o.held = a.pid || 'mano'; o.cont = null; if (p) p.carry = a.prop; break; }
    case 'place': { const o = WORLD.props[a.prop]; Object.assign(o, { room:a.room, x:a.x, y:a.y, fy:a.fy, surf:a.surf, cont:null }); delete o.held; if (p) p.carry = null; break; }
    case 'store': { const o = WORLD.props[a.prop]; Object.assign(o, { room:a.room, cont:a.cont, t:Date.now() }); delete o.held; if (p) p.carry = null; break; }
    case 'chair': WORLD.chairs[a.i] = a.out ? 1 : 0; break;
    case 'lamp': WORLD.lamps[a.lamp] = a.off ? 1 : 0; break;
    case 'tv': WORLD.tv = !!a.on; break;
    case 'tower': WORLD.towers.push({ x:a.x, y:a.y, s:a.s }); break;
    case 'untower': WORLD.towers.splice(a.i, 1); break;
    case 'kick': Object.assign(ball, { vx:a.vx, vy:a.vy, vz:a.vz }); break;
    case 'ink': WORLD.ink = a.data; inkImg = null; break;
    case 'pose': if (p){ p.pose = a.pose; } break;
    case 'found': WORLD.found[a.id] = 1; break;
    case 'unlock': if (!WORLD.unlocked.includes(a.key)) WORLD.unlocked.push(a.key); break;
    case 'look': WORLD.look[a.key] = a.val; break;
    case 'flag': WORLD.flags[a.key] = a.val; break;
  }
}
const Net = { send(a){ applyAction(a); logNet(a); if (a.type !== 'move') saveSoon(); } }; // mañana: socket.send(JSON.stringify(a))
const dispatch = a => Net.send(a);
function logNet(a){
  let s = `${a.type} · ${a.pid ? (a.pid === ME ? 'tú' : a.pid) : 'mundo'}`;
  if (a.scene) s += ` → ${a.scene}`;
  if (a.prop) s += ` · ${a.prop}`;
  if (a.surf) s += ` → ${a.surf}`;
  if (a.cont) s += ` → ${a.cont}`;
  if (a.x != null && !a.prop) s += ` (${Math.round(a.x)}, ${Math.round(a.y)})`;
  netLines.unshift(s); netLines.length = Math.min(netLines.length, 6);
  if (netOn) $('netlines').innerHTML = netLines.map(l => `<div>${esc(l)}</div>`).join('');
}
let saveTimer = 0;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
function save(){
  try{
    const p = me();
    const w = { ...WORLD, ball:{ x:ball.x, y:ball.y } };
    localStorage.setItem(KEY, JSON.stringify({ p: p ? { scene:p.scene, x:p.x, y:p.y, carry:p.carry } : null, w }));

  ball.vz -= 1400*dt; ball.z += ball.vz*dt;
  if (ball.z < 0){ ball.z = 0; ball.vz = -ball.vz*.45; if (ball.vz < 60) ball.vz = 0; }
  const f = ball.z > 0 ? .999 : Math.pow(.25, dt);
  ball.vx *= f; ball.vy *= f;
  ball.spin += (ball.vx / Math.max(8, ballR())) * dt;
  if (ball.x < 150){ ball.x = 150; ball.vx = Math.abs(ball.vx)*.7; }
  if (ball.x > 1235){ ball.x = 1235; ball.vx = -Math.abs(ball.vx)*.7; }
  if (ball.y < 585){ ball.y = 585; ball.vy = Math.abs(ball.vy)*.7; }

}
function runSeq(p, steps, done){ p.seq = { steps, i:0, t:0, done }; }
function updateSeq(p, dt){
  const q = p.seq; if (!q) return false;
  const st = q.steps[q.i]; q.t += dt;
  const k = clamp(q.t / st.dur, 0, 1);
  st.upd(k);
  if (k >= 1){ q.i++; q.t = 0; if (q.i >= q.steps.length){ p.seq = null; q.done && q.done(); } }
  return true;
}

/* ---------- Toque en una escena ---------- */
function hidePMenu(){ $('pmenu').hidden = true; }
function hitProp(x, y){
  let best = null, area = 1e9;
  const room = me().scene;
  for (const id in WORLD.props){
    const o = WORLD.props[id]; if (o.room !== room || o.cont || o.held) continue;
    const r = propRect(id), pad = Math.min(r.w, r.h) * .08;
    if (x >= r.x + pad && x <= r.x + r.w - pad && y >= r.y + pad && y <= r.y + r.h){
      const a = r.w*r.h; if (a < area){ area = a; best = id; }
    }
  }
  return best;
}
function hitSurface(x, y){
  const room = me().scene, list = SURF[room] || [];
  let best = null, bd = 1e9;
  for (const s of list){
    const k = SCENES[room].H(s.fy) / 250;
    if (x < s.x0 - 12 || x > s.x1 + 12) continue;
    let d;
    if (s.y0 != null){ if (y < s.y0 - 50*k || y > s.y1 + 25*k) continue; d = 0; }
    else { if (y < s.y - 85*k || y > s.y + 22*k) continue; d = Math.abs(y - (s.y - 30*k)); }
    if (d < bd){ bd = d; best = s; }
  }
  return best;
}
function hitCont(x, y){ for (const c of (CONT[me().scene] || [])) if (Math.hypot(x - c.x, y - c.y) <= c.r) return c; return null; }
const inRect = (x, y, r) => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3];
function standPointFor(fy, x){ const s = SCENES[me().scene]; return [clamp(x, 40, s.w - 40), clampBand(s, fy + 40)]; }

function walkTo(x, y, task){
  const p = me(), s = SCENES[p.scene];
  const tx = clamp(x, 30, s.w - 30), ty = clampBand(s, y);
  pending = task || null; tapRing = { x:tx, y:ty, t:T };
  dispatch({ type:'move', pid:ME, scene:p.scene, x:tx, y:ty });
}

function sceneTap(e){
  const p = me(); if (!p || fadeTo) return;
  if (p.seq) return;
  const s = SCENES[p.scene];
  const [x, y] = scr2world(e);

  // en el columpio: tocarlo otra vez = más alto
  if (p.pose === 'swing'){
    const th = Math.sin(swing.ph)*swing.amp, sx = SWING.px + SWING.L*Math.sin(th), sy = SWING.py + SWING.L*Math.cos(th);
    if (Math.hypot(x - sx, y - (sy - 40)) < 95){ swing.amp = Math.min(.62, swing.amp + .12); bubbleOn(p, '¡Más alto!'); if (swing.amp >= .45) setFlag('highSwing'); return; }
  }
  // 0) estrellas escondidas: se recogen al tocarlas
  const tr = hitTreasure(x, y);
  if (tr){ collectTreasure(tr); checkMissions(); return; }
  // 1) objetos: tocar = usar (los juguetes juegan); arrastrar = mover
  const pid = hitProp(x, y);
  if (pid){
    const o = WORLD.props[pid], d = PROP_DEF[pid];
    if (d.play === 'tren'){ if (o.surf !== 'piso'){ toast('Pon el tren en el piso para que ande.'); return; } playing[pid] = { kind:'tren', t0:T, dur:5, rx:150, ry:30 }; bubbleOn(p, '¡Chu chuuu!'); return; }
    if (d.play === 'aros'){ playing[pid] = { kind:'aros', t0:T, dur:1.8 }; sparkleBurst(o.x, o.y - 60, 10); bubbleOn(p, '¡Uno, dos, tres!'); return; }
    playing[pid] = { kind:'aros', t0:T, dur:.6 };
    if (!hintedDrag){ hintedDrag = true; toast('Mantén presionado y arrastra para moverlo.'); }
    return;
  }
  // 2) cajas: tocar = sacar lo último que se guardó
  const c = hitCont(x, y);
  if (c){
    const inside = Object.entries(WORLD.props).filter(([, o]) => o.room === p.scene && o.cont === c.id).sort((a, b) => (b[1].t||0) - (a[1].t||0));
    if (!inside.length){ toast(`${c.name[0].toUpperCase() + c.name.slice(1)} está vacío. Arrastra cosas aquí para guardarlas.`); return; }
    const id = inside[0][0], yy = clampBand(s, c.walk[1] - 10);
    dispatch({ type:'place', prop:id, room:p.scene, x:c.x + (Math.random() - .5)*80, y:yy, fy:yy, surf:'piso' });
    playing[id] = { kind:'aros', t0:T, dur:.8 }; sparkleBurst(c.x, c.y - 10, 8); checkMissions();
    return;
  }
  // 3) sillas del comedor: se corren al tocarlas
  if (p.scene === 'comedor'){
    for (let i = 1; i >= 0; i--){
      const r = chairRect(i);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h){ dispatch({ type:'chair', i, out:!WORLD.chairs[i] }); return; }
    }
  }
  // 4) actividades y lugares
  for (let i = s.hot.length - 1; i >= 0; i--){
    const h = s.hot[i];
    if (h.kind === 'act' && actHit(h, x, y)){ startAct(h, x, y); return; }
    if (h.kind === 'msg' && Math.hypot(x - h.x, y - h.y) <= h.r){ lucia(h.text); if (h.flag) setFlag(h.flag); return; }
    if (h.kind === 'door' && Math.hypot(x - h.x, y - h.y) <= h.r){ if (p.pose !== 'stand') standUp(); walkTo(h.walk[0], h.walk[1], h); return; }
    if (h.kind === 'edge' && Math.abs(x - h.x) < 90 && Math.abs(y - h.y) < 160){ if (p.pose !== 'stand') standUp(); walkTo(h.x, h.y, h); return; }
  }
  // 5) llevando algo en las manos: tocar una superficie = ir a ponerlo
  if (p.carry){
    const sf = hitSurface(x, y);
    if (sf){
      const [w] = propSize(p.carry, p.scene, sf.fy);
      const px = clamp(x, sf.x0 + w*.45, sf.x1 - w*.45), py = sf.y0 != null ? clamp(y, sf.y0, sf.y1) : sf.y;
      const [wx, wy] = standPointFor(sf.fy, px);
      walkTo(wx, wy, { kind:'place', surf:sf, x:px, y:py }); return;
    }
  }
  // 6) caminar
  if (y > s.band[0] - 60){ if (p.pose !== 'stand') standUp(); walkTo(x, y, null); }
}

function actHit(h, x, y){
  if (h.act === 'ball') return me().scene === 'patio' && Math.hypot(x - ball.x, y - (ball.y - ballR() - ball.z)) < ballR() + 26;
  if (h.act === 'sand'){
    for (let i = WORLD.towers.length - 1; i >= 0; i--){ const t = WORLD.towers[i], th = towerSize(t); if (Math.abs(x - t.x) < th*.55 && y > t.y - th*1.25 && y < t.y + 8) return true; }
    return inRect(x, y, h.hit) && !(x > 1540 && x < 1625 && y < 572);
  }
  if (h.hit) return inRect(x, y, h.hit);
  return Math.hypot(x - h.x, y - h.y) <= h.r;
}
function startAct(h, x, y){
  const p = me();
  switch (h.act){
    case 'sit': {
      if (p.pose !== 'stand') standUp();
      const sx = clamp(x, h.x0, h.x1);
      const w = h.walk === 'front' ? [sx, h.fy + 45] : [sx < h.x0 + (h.x1-h.x0)/2 ? h.x0 - 70 : h.x1 + 70, h.fy + 15];
      walkTo(w[0], w[1], { kind:'sit', x:sx, seatY:h.seatY, fy:h.fy });
      break;
    }
    case 'ball': {
      const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy) || 1;
      dispatch({ type:'kick', vx:dx/d*560, vy:dy/d*220 + (Math.random() - .5)*140, vz:300 });
      setFlag('kicked'); break;
    }
    case 'sand': {
      for (let i = WORLD.towers.length - 1; i >= 0; i--){
        const t = WORLD.towers[i], th = towerSize(t);
        if (Math.abs(x - t.x) < th*.55 && y > t.y - th*1.25 && y < t.y + 8){ interact({ kind:'untower', i }); return; }
      }
      interact({ kind:'tower', x, y:clamp(y, 560, 602) });
      break;
    }
    case 'tv': case 'lamp': case 'board': interact({ kind:'act', h }); break;
    default: if (p.pose !== 'stand') standUp(); walkTo(h.walk[0], h.walk[1], { kind:'act', h });
  }
}

/* =====================================================================
   CONTROL TIPO AVATAR WORLD
   - Mantener presionado y arrastrar: objetos, la pelota y la propia Lucía.
   - Lucía arrastrada por el piso camina (se ven los pasos); arrastrada hacia
     arriba se levanta en el aire y al soltarla cae donde se suelte:
     en el sofá se sienta, en el columpio se columpia, en la cama duerme,
     en una puerta cambia de cuarto.
   - Tocar (sin arrastrar) usa las cosas al instante.
   ===================================================================== */
let gest = null, hintedDrag = false;
const LIFT_MARGIN = 40;
function luciaBox(p){
  const s = SCENES[p.scene];
  if (p.pose === 'swing'){ const th = Math.sin(swing.ph)*swing.amp, sx = SWING.px + SWING.L*Math.sin(th), sy = SWING.py + SWING.L*Math.cos(th), H = s.H(545); return { x0:sx - H*.3, x1:sx + H*.3, y0:sy - H*.8, y1:sy + H*.2 }; }
  if (p.pose === 'sit'){ const H = s.H(p.fy); return { x0:p.x - H*.3, x1:p.x + H*.3, y0:p.seatY - H*.78, y1:p.seatY + H*.2 }; }
  const H = s.H(p.fy || p.y), y = p.lifted ? p.ly : p.y;
  return { x0:p.x - H*.24, x1:p.x + H*.24, y0:y - H*.98, y1:y + 6 };
}
const inBox = (x, y, b) => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1;
function sceneDown(e){
  if (!$('dialog').hidden){ closeDialog(); gest = null; return; }
  ['rooms','ideas','pVestir','pBolso','pTareas','pTesoros'].forEach(i => $(i).hidden = true); hidePMenu();
  const p = me(); if (!p || fadeTo || p.seq){ gest = null; return; }
  const [x, y] = scr2world(e);
  let kind = null, id = null;
  if (p.carry && !p.seq){ const H = SCENES[p.scene].H(p.y), [hx, hy] = handPos(p); if (Math.abs(x - hx) < H*.22 && y > hy - H*.4 && y < hy + 10) kind = 'held'; }
  if (!kind && p.pose !== 'sleep' && inBox(x, y, luciaBox(p))) kind = 'lucia';
  if (!kind && !hitTreasure(x, y)){ id = hitProp(x, y); if (id) kind = 'prop'; }
  if (!kind && p.scene === 'patio' && Math.hypot(x - ball.x, y - (ball.y - ballR() - ball.z)) < ballR() + 22) kind = 'ball';
  gest = { kind, id, sx:e.clientX, sy:e.clientY, t0:performance.now(), drag:false, ox:0, oy:0, hist:[], pid:e.pointerId };
  if (kind === 'lucia'){ const yy = p.lifted ? p.ly : (p.pose === 'sit' ? p.fy : p.pose === 'swing' ? 590 : p.y); gest.ox = p.x - x; gest.oy = yy - y; }
  if (kind){ gest.holdTimer = setTimeout(() => { if (gest && !gest.drag) startDrag(e.clientX, e.clientY); }, 260); }
}
function sceneMove(e){
  if (!gest || e.pointerId !== gest.pid) return;
  const d = Math.hypot(e.clientX - gest.sx, e.clientY - gest.sy);
  if (!gest.drag){ if (gest.kind && d > 9) startDrag(e.clientX, e.clientY); else return; }
  updateDrag(e.clientX, e.clientY);
}
function sceneUp(e){
  if (!gest || e.pointerId !== gest.pid) return;
  clearTimeout(gest.holdTimer);
  const g = gest; gest = null;
  if (g.drag){ endDrag(g, e.clientX, e.clientY); return; }
  sceneTap(e);
}
function fingerWorld(cx, cy){ const sc = sceneScale(); return [cx / sc + cam.x, cy / sc + cam.y]; }

function startDrag(cx, cy){
  const g = gest, p = me(); if (!g || g.drag) return;
  g.drag = true; pending = null;
  if (navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
  if (g.kind === 'lucia'){
    if (p.pose !== 'stand'){
      const y0 = p.pose === 'sit' ? p.fy : 590;
      swing.riding = false; p.pose = 'stand'; p.fy = null; p.y = clampBand(SCENES[p.scene].band ? SCENES[p.scene] : SCENES.sala, y0);
      dispatch({ type:'pose', pid:ME, pose:'stand' }); updateActionBar();
    }
    p.dragging = true; p.tx = p.x; p.ty = p.y;
  }
  if (g.kind === 'prop' || g.kind === 'held'){
    if (g.kind === 'held'){ g.id = p.carry; p.carry = null; updateActionBar(); }
    const o = WORLD.props[g.id];
    g.prev = { room:o.room, x:o.x, y:o.y, fy:o.fy, surf:o.surf };
    if (g.kind === 'held') g.prev = { room:p.scene, x:p.x, y:clampBand(SCENES[p.scene], p.y + 8), fy:clampBand(SCENES[p.scene], p.y + 8), surf:'piso' };
    dispatch({ type:'pick', prop:g.id });
    dragProp = { id:g.id, x:o.x, y:o.y, target:null };
  }

let dragProp = null;
function updateDrag(cx, cy){

  const [x, y] = fingerWorld(cx, cy);
  g.hist.push({ x, y, t:performance.now() }); if (g.hist.length > 6) g.hist.shift();
  if (g.kind === 'lucia'){
    const fx = clamp(x + g.ox, 30, s.w - 30), fy = y + g.oy;
    if (fy < s.band[0] - LIFT_MARGIN){ p.lifted = true; p.x = fx; p.ly = fy; p.moving = false; }
    else {
      if (p.lifted){ p.lifted = false; p.y = clampBand(s, fy); p.crouch = T; }
      p.tx = fx; p.ty = clampBand(s, fy);
    }
  }

}
function overEl(id, cx, cy){ const el = $(id); if (!el || el.hidden) return false; const r = el.getBoundingClientRect(); return cx >= r.left - 6 && cx <= r.right + 6 && cy >= r.top - 6 && cy <= r.bottom + 6; }
function dropTarget(x, y, cx, cy){
  const p = me(), s = SCENES[p.scene];
  if (overEl('bBolso', cx, cy)) return { kind:'bag' };
  const c = hitCont(x, y); if (c) return { kind:'cont', c };
  if (inBox(x, y, luciaBox(p)) && p.pose === 'stand' && !p.carry) return { kind:'lucia' };
  const sf = hitSurface(x, y);
  if (sf){
    const [w] = propSize(dragProp.id, p.scene, sf.fy);
    const px = clamp(x, sf.x0 + w*.45, sf.x1 - w*.45), py = sf.y0 != null ? clamp(y, sf.y0, sf.y1) : sf.y;
    const fy = sf.y0 != null ? sf.fy + (py - sf.y1) : sf.fy;
    return { kind:'surf', sf, x:px, y:py, fy };
  }
  if (y > s.band[0] - 70){ const yy = clampBand(s, y); return { kind:'floor', x:clamp(x, 40, s.w - 40), y:yy, fy:yy }; }
  return null;
}
function endDrag(g, cx, cy){
  const p = me(), s = SCENES[p.scene];
  const [x, y] = fingerWorld(cx, cy);
  if (g.kind === 'lucia'){
    p.dragging = false;
    const wasLifted = p.lifted; p.lifted = false;
    const fx = p.x, fyFeet = wasLifted ? p.ly : p.ty;
    // ¿la soltó sobre algo?
    for (const h of s.hot){
      if (h.kind === 'act' && ['sit','swing','slide','sleep'].includes(h.act) && actHit(h, x, y)){
        p.y = p.ty = clampBand(s, fyFeet); p.tx = p.x;
        if (h.act === 'sit'){ p.standAt = [clamp(x, h.x0, h.x1), clampBand(s, h.fy + 45)]; p.x = clamp(x, h.x0, h.x1); p.seatY = h.seatY; p.fy = h.fy; dispatch({ type:'pose', pid:ME, pose:'sit' }); if (p.scene === 'sala' && WORLD.tv) setFlag('tvSit'); updateActionBar(); }
        else if (h.act === 'swing'){ p.pose = 'swing'; swing.riding = true; swing.amp = Math.max(swing.amp, .22); dispatch({ type:'pose', pid:ME, pose:'swing' }); updateActionBar(); setFlag('swung'); }
        else if (h.act === 'slide'){ p.x = 300; p.y = 585; slideSeq(p); }
        else if (h.act === 'sleep'){ sleepSeq(p); }
        save(); return;
      }
      if ((h.kind === 'door' && Math.hypot(x - h.x, y - h.y) <= h.r) || (h.kind === 'edge' && Math.abs(x - h.x) < 90 && Math.abs(y - h.y) < 170)){
        p.y = p.ty = clampBand(s, fyFeet); goScene(h.go, h.at[0], h.at[1]); return;
      }
    }
    if (wasLifted){ p.y = p.ty = clampBand(s, fyFeet); p.tx = p.x; p.crouch = T; bubbleOn(p, '¡Hop!'); }
    save(); return;
  }
  if (g.kind === 'ball'){
    ball.held = false; ball.z = 30;
    const h = g.hist; let vx = 0, vy = 0;
    if (h.length >= 2){ const a = h[0], b = h[h.length - 1], dt = Math.max(16, b.t - a.t)/1000; vx = clamp((b.x - a.x)/dt, -1100, 1100); vy = clamp((b.y - a.y)/dt, -700, 700); }
    dispatch({ type:'kick', vx:vx*.8, vy:vy*.6, vz:220 });

    const id = dragProp.id, t = dropTarget(x, y, cx, cy); dragProp = null;

    if (t.kind === 'bag'){

      dispatch({ type:'store', prop:id, room:p.scene, cont:'bolso' }); toast(`${PROP_DEF[id].name} va en el bolso.`); updateBadges(); checkMissions(); return;
    }
    if (t.kind === 'cont'){ dispatch({ type:'store', prop:id, room:p.scene, cont:t.c.id }); sparkleBurst(t.c.x, t.c.y - 20, 10); checkMissions(); return; }
    if (t.kind === 'lucia'){ dispatch({ type:'pick', pid:ME, prop:id }); crouch(p); updateActionBar(); checkMissions(); return; }
    dispatch({ type:'place', prop:id, room:p.scene, x:t.x, y:t.y, fy:t.fy, surf:t.kind === 'surf' ? t.sf.id : 'piso' });
    playing[id] = { kind:'land', t0:T, dur:.35 };
    checkMissions();
  }
}
function drawDragged(){
  const p = me(), s = SCENES[p.scene];

    const t = dragProp.target, id = dragProp.id, im = IMG['p:' + id];

/* Al llegar al destino */
function interact(task){
  const p = me(), s = SCENES[p.scene];
  switch (task.kind){
    case 'door': case 'edge':
      goScene(task.go, task.at[0], task.at[1]); return;
    case 'msg': lucia(task.text); if (task.flag) setFlag(task.flag); return;
    case 'treasure': collectTreasure(task.t); checkMissions(); return;
    case 'pick': {
      const o = WORLD.props[task.prop]; if (!o || o.held || o.cont || o.room !== p.scene) return;
      crouch(p);
      dispatch({ type:'pick', pid:ME, prop:task.prop });
      updateActionBar();
      return;
    }
    case 'place': {
      const id = p.carry; if (!id) return;
      const sf = task.surf;
      let fy = sf.fy;
      if (sf.y0 != null) fy = sf.fy + (task.y - sf.y1);
      flyFromHands(id, p, task.x, task.y, fy);
      dispatch({ type:'place', pid:ME, prop:id, room:p.scene, x:task.x, y:task.y, fy, surf:sf.id });
      updateActionBar(); checkMissions();
      return;
    }
    case 'store': {
      const id = p.carry; if (!id) return;
      dispatch({ type:'store', pid:ME, prop:id, room:p.scene, cont:task.cont.id });
      bubbleOn(p, '¡Guardado!'); sparkleBurst(task.cont.x, task.cont.y - 20, 10);
      updateActionBar(); checkMissions();
      return;
    }
    case 'takeOut': {
      const inside = Object.entries(WORLD.props).filter(([, o]) => o.room === p.scene && o.cont === task.cont.id).sort((a, b) => (b[1].t||0) - (a[1].t||0));
      if (!inside.length){ lucia(`${task.cont.name[0].toUpperCase() + task.cont.name.slice(1)} está vacío. Puedo guardar cosas aquí.`); return; }
      crouch(p); dispatch({ type:'pick', pid:ME, prop:inside[0][0] }); updateActionBar(); checkMissions();
      return;
    }
    case 'chair': {
      const i = task.i, out = !WORLD.chairs[i];
      p.dir = 'derecha';
      dispatch({ type:'chair', i, out });
      bubbleOn(p, out ? '¡Uff!' : '¡Listo!');
      return;
    }
    case 'sit': {
      p.standAt = [p.x, p.y];
      p.x = task.x; p.seatY = task.seatY; p.fy = task.fy;
      dispatch({ type:'pose', pid:ME, pose:'sit' });
      if (p.scene === 'sala' && WORLD.tv) setFlag('tvSit');
      updateActionBar();
      return;
    }
    case 'kick': {
      const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy) || 1;
      if (d > 140){ startAct({ act:'ball' }, ball.x, ball.y); return; }
      p.dir = dx >= 0 ? 'derecha' : 'izquierda'; p.kick = T;
      dispatch({ type:'kick', vx:dx/d*640, vy:dy/d*240 + (Math.random()-.5)*120, vz:260 });
      setFlag('kicked');
      return;
    }
    case 'tower': {
      if (WORLD.towers.length >= 8) dispatch({ type:'untower', i:0 });
      crouch(p); p.dir = 'derecha';
      dispatch({ type:'tower', x:task.x, y:task.y, s:.85 + Math.random()*.4 });
      towersPop[WORLD.towers.length - 1] = T;
      setFlag('towers', (F().towers || 0) + 1);
      sparkleBurst(task.x, task.y - 20, 8, '#f6dfa8');
      return;
    }
    case 'untower': {
      const t = WORLD.towers[task.i]; if (!t) return;
      sparkleBurst(t.x, t.y - 20, 14, '#e8c98a');
      dispatch({ type:'untower', i:task.i });
      Object.keys(towersPop).forEach(k => delete towersPop[k]);
      bubbleOn(p, '¡Pum!');
      return;
    }
    case 'play': {
      const id = task.prop, o = WORLD.props[id];
      if (task.play === 'tren' && o.surf !== 'piso'){ lucia('Pon el tren en el piso para que pueda andar.'); return; }
      if (task.play === 'tren') playing[id] = { kind:'tren', t0:T, dur:5, rx:150, ry:30 };
      if (task.play === 'aros'){ playing[id] = { kind:'aros', t0:T, dur:1.8 }; sparkleBurst(o.x, o.y - 60, 10); }
      bubbleOn(p, task.play === 'tren' ? '¡Chu chuuu!' : '¡Uno, dos, tres!');
      return;
    }
    case 'act': {
      const h = task.h;
      if (h.act === 'tv'){ dispatch({ type:'tv', on:!WORLD.tv }); bubbleOn(p, WORLD.tv ? '¡Mi programa!' : 'Apagada'); }
      if (h.act === 'lamp'){ dispatch({ type:'lamp', lamp:h.lamp, off:!WORLD.lamps[h.lamp] }); }
      if (h.act === 'board') openBoard();
      if (h.act === 'swing'){
        p.pose = 'swing'; swing.riding = true; swing.amp = Math.max(swing.amp, .22);
        dispatch({ type:'pose', pid:ME, pose:'swing' }); updateActionBar(); setFlag('swung');
      }
      if (h.act === 'slide') slideSeq(p);
      if (h.act === 'sleep') sleepSeq(p);
      return;
    }
  }
}

/* Tobogán */
function slideSeq(p){
  const fy = 515, path = [[445,398],[480,418],[520,446],[560,478],[597,506]];
  const along = k => { const n = path.length - 1, i = Math.min(n - 1, Math.floor(k*n)), t = k*n - i; return [lerp(path[i][0], path[i+1][0], t), lerp(path[i][1], path[i+1][1], t)]; };
  runSeq(p, [
    { dur:.45, upd:k => { p.x = lerp(300, 292, k); p.y = lerp(585, 517, k); p.dir = 'espalda'; p.fy = null; } },
    { dur:1.1, upd:k => { p.x = lerp(292, 345, k); p.y = lerp(517, 396, k); p.fy = fy; p.dir = 'espalda'; p.climb = k; } },
    { dur:.4, upd:k => { p.x = lerp(345, 430, k); p.y = 395; p.fy = fy; p.dir = 'derecha'; p.climb = 0; } },
    { dur:1.0, upd:k => { const [x, y] = along(k*k); p.pose = 'slide'; p.x = x; p.seatY = y; p.fy = fy; if (k > .96 && !p.whee){ p.whee = 1; } } },
    { dur:.35, upd:k => { p.pose = 'stand'; p.x = lerp(597, 625, k); p.y = lerp(515, 590, k); p.fy = null; p.dir = 'frente'; } },
  ], () => { p.tx = p.x; p.ty = p.y; p.whee = 0; bubbleOn(p, '¡Wiii!'); dispatch({ type:'pose', pid:ME, pose:'stand' }); setFlag('slid'); });
  dispatch({ type:'pose', pid:ME, pose:'slide' });
}

function sleepSeq(p){

}

/* Recolor del sprite: solo cambia los píxeles de la prenda elegida (por tono y por zona del cuerpo). */
const sprCache = {};

function spr(view){
  const im = IMG[view] || IMG.frente; if (!im) return null;
  const L = WORLD.look || {}, key = `${view}|${L.overol}|${L.monio}|${L.camiseta}`;
  if (sprCache[key]) return sprCache[key];
  if (L.overol === 'rosado' && L.monio === 'amarillo' && L.camiseta === 'amarillo') return (sprCache[key] = im);
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  let d; try{ d = x.getImageData(0, 0, c.width, c.height); }catch(e){ return (sprCache[key] = im); }

      else if (yellow && fy > .38 && fy < .68 && ca.id !== 'amarillo') apply(i, h, s, l, ca, 48);

}

/* ---------- Vida en la calle ---------- */
const cars = [], peds = [];

const NEIGHBORS = ['juan','lala','bubu'];
function seedStreet(){ carTimer = 1.5; pedTimer = 1; spawnPed(Math.random()*1900); }
function spawnCar(){ const dir = Math.random() < .5 ? 1 : -1; cars.push({ x: dir > 0 ? -260 : 2200, y: dir > 0 ? 872 : 834, dir, v: 260 + Math.random()*140, col: CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)], kind: Math.random() < .25 ? 'van' : 'car' }); }

  const dir = Math.random() < .5 ? 1 : -1, s = SCENES.calle;

function updateStreet(dt){
  carTimer -= dt; pedTimer -= dt;
  if (carTimer <= 0){ spawnCar(); carTimer = 4 + Math.random()*6; }
  if (pedTimer <= 0){ if (peds.length < 3) spawnPed(); pedTimer = 5 + Math.random()*7; }
  for (const c of cars) c.x += c.dir * c.v * dt;
  for (let i = cars.length - 1; i >= 0; i--) if (cars[i].x < -320 || cars[i].x > 2300) cars.splice(i, 1);
  const p = me();
  for (const n of peds){
    n.x += n.dir * n.v * dt; n.walk += dt * 9;
    if (p && !n.greeted && Math.abs(n.x - p.x) < 90 && Math.abs(n.y - p.y) < 50){ n.greeted = true; n.bubble = { text:'¡Hola, Lucía!', until:T + 2.2 }; }
    if (n.bubble && T > n.bubble.until) n.bubble = null;
  }
  for (let i = peds.length - 1; i >= 0; i--) if (peds[i].x < -120 || peds[i].x > 2060) peds.splice(i, 1);

/* ---------- Bucle ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; T += dt;
  update(dt); render(); renderFx(dt);
  requestAnimationFrame(frame);
}
function update(dt){
  if (fadeTo){
    fadeTo.t += dt;
    if (fadeTo.t >= .28 && !fadeTo.done){ fadeTo.done = true; fadeTo.fn(); fade = 1; }
    if (fadeTo.t >= .3) fadeTo = null;
  } else if (fade > 0) fade = Math.max(0, fade - dt*2.8);
  if (mode === 'map'){
    if (mapCam.anim){
      const a = mapCam.anim; a.t = Math.min(1, a.t + dt*1.8); const k = ease(a.t);
      mapCam.cx = lerp(a.from.cx, a.to.cx, k); mapCam.cy = lerp(a.from.cy, a.to.cy, k); mapCam.z = lerp(a.from.z, a.to.z, k);
      clampMap(); if (a.t >= 1) mapCam.anim = null;
    }
    updateLabels();
  }
  if (mode === 'scene'){
    const p = me(), s = SCENES[p.scene];
    if (p.lifted){ p.moving = false; }
    else if (!updateSeq(p, dt) && p.pose === 'stand'){
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d > 2){
        const speed = s.H(p.y) * (p.dragging ? 3 : 1.8), st = Math.min(d, speed*dt);
        p.x += dx/d*st; p.y += dy/d*st; p.moving = true; p.walk += dt*10; p.idle = 0;
        p.dir = Math.abs(dx) > Math.abs(dy)*.7 ? (dx > 0 ? 'derecha' : 'izquierda') : (dy < 0 ? 'espalda' : 'frente');
      } else {
        if (p.moving){ p.moving = false; save(); }
        p.idle += dt; if (p.idle > 1.4 && !p.carry && T - (p.kick || 0) > 1) p.dir = 'frente';
        if (pending){ const h = pending; pending = null; interact(h); }
      }
    } else p.moving = false;
    if (p.bubble && T > p.bubble.until) p.bubble = null;
    if (s.street) updateStreet(dt);
    if (p.scene === 'patio'){ updateBall(dt); updateSwing(dt); }
    for (let i = 0; i < 2; i++) chairAnim[i] = lerp(chairAnim[i], WORLD.chairs[i], Math.min(1, dt*6));
    for (let i = flights.length - 1; i >= 0; i--){ flights[i].t += dt/.35; if (flights[i].t >= 1) flights.splice(i, 1); }
    const [tx, ty] = camTarget(), k = fade > .5 ? 1 : Math.min(1, dt*5);
    cam.x += (tx - cam.x)*k; cam.y += (ty - cam.y)*k;
  }
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#2a2147'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (mode === 'intro' && IMG.ciudad){
    const s = Math.max(vw / MAP_W, vh / MAP_H) * 1.12, drift = Math.sin(T*.05)*.5 + .5, w = MAP_W*s, h = MAP_H*s;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.drawImage(IMG.ciudad, -(w - vw)*drift, -(h - vh)/2, w, h);
  }
  if (mode === 'map') renderMap();
  if (mode === 'scene') renderScene();
  if (fadeTo || fade > 0){
    const a = fadeTo ? Math.min(1, fadeTo.t/.28) : fade;
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = `rgba(255,236,200,${a})`; ctx.fillRect(0, 0, cv.width, cv.height);
  }
}
function renderMap(){
  const s = mapBase()*mapCam.z;

  ctx.globalAlpha = 1;
}
function renderScene(){
  const p = me(), s = SCENES[p.scene], sc = sceneScale(), room = p.scene;

  // entidades ordenadas por profundidad
  const ents = [];
  for (const id in WORLD.props){
    const o = WORLD.props[id];
    if (o.room !== room || o.cont || o.held || flights.some(f => f.id === id)) continue;
    ents.push({ y:o.fy, draw:() => drawProp(id) });
  }
  if (room === 'comedor'){
    ents.push({ y:680, draw:() => drawChair(0) }); ents.push({ y:684, draw:() => drawChair(1) });
    ents.push({ y:686.5, draw:() => { if (IMG.pata){ const b = BOX.comedor.pata; ctx.drawImage(IMG.pata, b.x, b.y, b.w, b.h); } } });
  }
  if (room === 'patio'){
    ents.push({ y:ball.y, draw:drawBall });
    ents.push({ y:521, draw:drawSwing });
    WORLD.towers.forEach((t, i) => ents.push({ y:t.y, draw:() => drawTower(t, i) }));
  }
  for (const t of visibleTreasures(room)) ents.push({ y:t.fy + .2, draw:() => drawTreasure(t) });
  if (p.pose !== 'swing' && !p.lifted) ents.push({ y:p.pose === 'sit' || p.pose === 'slide' || p.pose === 'sleep' ? p.fy + .5 : (p.fy || p.y), draw:() => drawLucia(p, s) });
  if (s.street){
    for (const n of peds) ents.push({ y:n.y, draw:() => drawNeighbor(n, s) });

  drawDragged();
  for (const f of flights){
    const k = ease(Math.min(1, f.t)), x = lerp(f.x0, f.x1, k), y = lerp(f.y0, f.y1, k) - Math.sin(k*Math.PI)*40;
    const [w, h] = propSize(f.id, room, lerp(p.y, f.fy, k)), imf = IMG['p:' + f.id];
    if (imf) ctx.drawImage(imf, x - w/2, y - h, w, h);
  }
  for (const c of (CONT[room] || [])){
    const n = Object.values(WORLD.props).filter(o => o.room === room && o.cont === c.id).length;
    if (n){ circ(ctx, c.x + c.r*.6, c.y - c.r*.6, 15, '#ff8a3d'); ctx.fillStyle = '#fff'; ctx.font = '800 16px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n, c.x + c.r*.6, c.y - c.r*.6 + 1); }
  }

  if (p.bubble){
    const H = s.H(p.fy || p.y);
    const by = p.pose === 'swing' ? 380 : p.pose === 'sit' || p.pose === 'slide' ? p.seatY - H*.82 : p.y - H - 30;
    const bx = p.pose === 'swing' ? SWING.px : p.x;

}
function drawGuides(room){

/* ---------- Dibujo de Lucía ---------- */
function drawSit(im, x, seatY, H){
  im = spr('frente') || im;
  if (!im) return;
  const W = H*im.width/im.height, hip = .72, knee = .86, sq = .25;
  const topH = H*hip, midH = H*(knee - hip)*sq, botH = H*(1 - knee);
  const top = seatY - topH - midH*.5;
  ctx.drawImage(im, 0, im.height*knee, im.width, im.height*(1 - knee), x - W/2, top + topH + midH - 1, W, botH + 1);
  ctx.drawImage(im, 0, im.height*hip, im.width, im.height*(knee - hip), x - W/2, top + topH - 1, W, midH + 2);
  drawAccBack('frente', x - W/2, top, W, H);
  ctx.drawImage(im, 0, 0, im.width, im.height*hip + 1, x - W/2, top, W, topH + 1);
  drawAcc('frente', x - W/2, top, W, H);
}
function drawLucia(p, s){
  if (p.pose === 'sit' || p.pose === 'slide'){
    const H = s.H(p.fy);
    ell(ctx, p.x, p.pose === 'sit' ? p.fy - 4 : p.seatY + 6, H*.18, H*.035, 0, 'rgba(60,30,20,.18)');
    drawSit(IMG.frente, p.x, p.seatY, H);
    return;
  }
  if (p.pose === 'sleep'){
    const im = spr('frente'); if (!im) return;
    const H = s.H(690) * .95, W = H*im.width/im.height, hx = 205, hy = 482;
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(-Math.PI/2); ctx.drawImage(im, -W/2, 0, W, H); ctx.restore();
    const bx0 = hx + H*.3, bx1 = hx + H + 16, by0 = hy - W*.38, by1 = hy + W*.47;
    ctx.fillStyle = vgrad(ctx, by0, by1, '#f9bccb', '#e8879f');
    ctx.beginPath(); ctx.moveTo(bx0, by0 + 12); ctx.quadraticCurveTo(lerp(bx0, bx1, .55), by0 - 16, bx1, by0 + 18);
    ctx.quadraticCurveTo(bx1 + 10, lerp(by0, by1, .6), bx1 + 2, by1); ctx.lineTo(bx0 - 4, by1); ctx.closePath(); ctx.fill();
    const dots = ['#ffe27a','#9fd6ff','#fff'];
    for (let i = 0; i < 9; i++) circ(ctx, lerp(bx0 + 30, bx1 - 14, (i % 3)/2 + (Math.floor(i/3) % 2)*.12), lerp(by0 + 22, by1 - 14, Math.floor(i/3)/2), 7, dots[i % 3]);
    ctx.fillStyle = '#ffd6e0'; rr(ctx, bx0 - 8, by0 + 8, 20, by1 - by0 - 8, 10); ctx.fill();
    ctx.strokeStyle = '#e8879f'; ctx.lineWidth = 3;
    for (let x = bx0 + 6; x < bx1; x += 12){ ctx.beginPath(); ctx.moveTo(x, by1); ctx.lineTo(x - 2, by1 + 14); ctx.stroke(); }
    return;
  }
  const im = spr(p.dir); if (!im) return;

  const bob = p.moving ? -Math.abs(Math.sin(p.walk)) * H * .035 : 0;
  const tilt = p.moving ? Math.sin(p.walk) * .035 : 0;
  const cr = p.crouch ? clamp((T - p.crouch)/.35, 0, 1) : 1;
  const squat = cr < 1 ? 1 - Math.sin(cr*Math.PI)*.1 : 1;
  const breathe = p.moving ? 1 : 1 + Math.sin(T*2.4) * .008;
  const kick = p.kick ? clamp((T - p.kick)/.3, 0, 1) : 1;
  const lean = kick < 1 ? Math.sin(kick*Math.PI) * (p.dir === 'izquierda' ? -.12 : .12) : 0;
  const carry = p.carry && IMG['p:' + p.carry];
  const drawCarry = () => {
    const [cw, chh] = propSize(p.carry, p.scene, p.y);
    const k = Math.min(1, (H*.5) / Math.max(cw, chh));
    const dw = cw*k, dh = chh*k;
    const off = p.dir === 'izquierda' ? -.2*H : p.dir === 'derecha' ? .2*H : 0;
    ctx.drawImage(IMG['p:' + p.carry], p.x + off - dw/2, p.y - H*.3 - dh + bob, dw, dh);
  };

  ctx.restore();
  if (carry && p.dir === 'espalda') drawCarry();
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.translate(0, bob); ctx.rotate(tilt + lean); ctx.scale(1, breathe*squat);
  drawAccBack(p.dir, -w/2, -H, w, H);
  ctx.drawImage(im, -w/2, -H, w, H);
  drawAcc(p.dir, -w/2, -H, w, H);
  ctx.restore();
  if (carry && p.dir !== 'espalda') drawCarry();
}

function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }

/* ---------- Tablero de tiza ---------- */
const BW = 393, BH = 687;
const board = $('board'), bctx = board.getContext('2d');

const ictx = ink.getContext('2d');

let chalk = CHALK[0], drawing = null;
board.width = BW; board.height = BH;
function openBoard(){
  ictx.clearRect(0, 0, BW, BH);
  if (WORLD.ink){ const im = new Image(); im.onload = () => { ictx.drawImage(im, 0, 0); paintBoard(); }; im.src = WORLD.ink; }
  $('chalks').innerHTML = '';
  CHALK.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chalk' + (c === chalk ? ' sel' : ''); b.style.background = c; b.setAttribute('aria-label', 'Tiza'); b.onclick = () => { chalk = c; $('chalks').querySelectorAll('.chalk').forEach(x => x.classList.toggle('sel', x === b)); }; $('chalks').appendChild(b); });
  paintBoard(); $('draw').hidden = false;
}
function paintBoard(){
  bctx.setTransform(1,0,0,1,0,0); bctx.clearRect(0, 0, BW, BH);
  const m = quadTransform(BOARDQ, BW, BH), det = m[0]*m[3] - m[1]*m[2];
  const inv = [m[3]/det, -m[1]/det, -m[2]/det, m[0]/det, (m[2]*m[5] - m[3]*m[4])/det, (m[1]*m[4] - m[0]*m[5])/det];
  bctx.setTransform(...inv); if (IMG.juegos) bctx.drawImage(IMG.juegos, 0, 0);
  bctx.setTransform(1,0,0,1,0,0); bctx.drawImage(ink, 0, 0);
}
function boardPt(e){ const r = board.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * BW, (e.clientY - r.top) / r.height * BH]; }
board.addEventListener('pointerdown', e => { board.setPointerCapture?.(e.pointerId); drawing = boardPt(e); stroke(drawing, drawing); });
board.addEventListener('pointermove', e => { if (!drawing) return; const p = boardPt(e); stroke(drawing, p); drawing = p; });
const endDraw = () => { drawing = null; };
board.addEventListener('pointerup', endDraw); board.addEventListener('pointercancel', endDraw);
function stroke(a, b){
  ictx.lineCap = 'round'; ictx.lineJoin = 'round'; ictx.strokeStyle = chalk; ictx.lineWidth = 9; ictx.globalAlpha = .88;
  ictx.beginPath(); ictx.moveTo(a[0], a[1]); ictx.lineTo(b[0] + .01, b[1]); ictx.stroke();
  ictx.globalAlpha = .35; ictx.lineWidth = 14; ictx.beginPath(); ictx.moveTo(a[0], a[1]); ictx.lineTo(b[0] + .01, b[1]); ictx.stroke();
  ictx.globalAlpha = 1; paintBoard();
}
$('dClear').onclick = () => { ictx.clearRect(0, 0, BW, BH); ictx.fillStyle = '#3d5845'; ictx.fillRect(0, 0, BW, BH); paintBoard(); };
$('dDone').onclick = () => { $('draw').hidden = true; dispatch({ type:'ink', data:ink.toDataURL('image/png') }); bubbleOn(me(), '¡Mira mi dibujo!'); setFlag('drew'); };

/* ---------- Arranque ---------- */
if (location.hash === '#debug') window.__g = { me, world:() => WORLD, go:goScene, cam, ball, swing, s2w:(x,y) => world2scr(x,y) };
resize();
requestAnimationFrame(frame);
loadAll().then(() => {
  $('loading').hidden = true; $('bPlay').hidden = false;
  const saved = load();
  if (saved && saved.w){
    const w = saved.w, fresh = freshWorld();
    for (const id in fresh.props) if (w.props && w.props[id]){ const o = { ...w.props[id] }; delete o.held; fresh.props[id] = o; }
    fresh.chairs = w.chairs || fresh.chairs; fresh.lamps = w.lamps || {}; fresh.tv = !!w.tv; fresh.ink = w.ink || null;
    fresh.towers = w.towers || []; fresh.done = w.done || {}; fresh.flags = w.flags || {}; fresh.found = w.found || {};
    fresh.unlocked = [...new Set([...DEFAULT_UNLOCK, ...(w.unlocked || [])])]; fresh.look = { ...fresh.look, ...(w.look || {}) };
    if (w.ball){ ball.x = w.ball.x; ball.y = w.ball.y; }
    if (saved.p && saved.p.carry && fresh.props[saved.p.carry]){ const o = fresh.props[saved.p.carry]; o.room = saved.p.scene; o.surf = 'piso'; o.cont = null; o.x = saved.p.x; o.y = saved.p.y; o.fy = saved.p.y; }
    WORLD = fresh;
    for (let i = 0; i < 2; i++) chairAnim[i] = WORLD.chairs[i];
  }
  updateBadges();
});
})();
</script>
